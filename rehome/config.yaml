name: Rehome
version: "0.5.1"
slug: rehome
url: "https://github.com/rehome-app/rehome-addons"
description: The Rehome wall dashboard for iPads that are too old for the app (iOS 5 and later), in Safari.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
panel_title: Rehome
homeassistant_api: true
map:
  - type: media
    read_only: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direct access, for iPads that can't open Home Assistant (pair them in Rehome under Settings → Use on Another iPad)
options:
  license_key: ""
  direct_access: true
  pairing_code: ""
  allowed_hosts: ""
schema:
  license_key: password?
  direct_access: bool
  pairing_code: match(^([0-9]{8,12})?$)
  allowed_hosts: str?
image: "ghcr.io/rehome-app/rehome"
